name: Atelier V7 - Featured websites QA

on:
  push:
    branches: [feature/featured-websites-autoplay]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atelier-v7-featured-sites-qa
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout updated Tech Editorial with ITMM and Learnio sites
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Reuse previously verified artwork and live-site previews
        uses: actions/download-artifact@v4
        with:
          name: atelier-v7-featured-dist
          run-id: 39779750626
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved-owned-assets

      - name: Restore owned image previews
        shell: bash
        run: |
          set -euo pipefail
          test -d saved-owned-assets/art
          mkdir -p client/studio/public/art client/studio/public/previews
          cp -a saved-owned-assets/art/. client/studio/public/art/
          if [ -d saved-owned-assets/previews ]; then cp -a saved-owned-assets/previews/. client/studio/public/previews/; fi
          echo "Artworks: $(find client/studio/public/art -type f -name '*.webp' | wc -l)"
          rm -f client/studio/public/previews/18.jpg
          echo "Project previews: $(find client/studio/public/previews -type f -name '*.jpg' | wc -l)"

      - name: Install Chromium and preview optimizer
        run: |
          npm install --prefix /tmp/studio-tools --ignore-scripts playwright@1.56.1
          /tmp/studio-tools/node_modules/.bin/playwright install --with-deps chromium
          python3 -m venv /tmp/studio-py
          /tmp/studio-py/bin/pip install pillow==11.3.0

      - name: Verify genuine ITMM and Learnio screenshots and deleted project removal
        run: |
          test -s client/studio/public/previews/itmm.jpg
          test -s client/studio/public/previews/learnio.jpg
          test ! -e client/studio/public/previews/18.jpg

      - name: TypeScript checks
        run: npx tsc -p tsconfig.studio.json --noEmit

      - name: Build optimized portfolio
        run: |
          npx vite build --config vite.studio.config.ts
          /tmp/studio-py/bin/python scripts/studio-optimize.py

      - name: Chromium desk, autoplay sites, VK experience and mobile
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/v5-http.log 2>&1 &
          sleep 2
          node scripts/studio-test.mjs
          node scripts/atelier-test.mjs
          node scripts/modern-laptop-test.mjs
          node scripts/tech-only-test.mjs
          node scripts/featured-autoplay-test.mjs

      - name: Screenshots and checks for final Tech design
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-v7-featured-review
          path: |
            tech-review/
            featured-review/
            ultralight-review/
            atelier-review/
            studio-review/
          retention-days: 7

      - name: Verified portfolio for HTTPS publication
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-v7-featured-dist
          path: dist/studio/
          include-hidden-files: true
          retention-days: 7
