name: Deploy KROKO HTTPS server
on:
  push:
    branches: [feature/free-rotate-desk]
    paths:
      - .github/workflows/deploy-kroko-server.yml
      - client/studio/public/kroko/**
      - scripts/kroko-api-test.mjs
permissions:
  contents: read
concurrency:
  group: kroko-spaceweb-server
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual PHP room API
        run: |
          php -l client/studio/public/kroko/api.php
          php -l client/studio/public/kroko/cards.php
          node scripts/kroko-api-test.mjs
          node scripts/kroko-rules-test.mjs
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/studio-tools --ignore-scripts playwright@1.56.1
          /tmp/studio-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Test five-device game against HTTP server
        run: |
          php -S 127.0.0.1:4173 -t client/studio/public >/tmp/kroko-https-test.log 2>&1 &
          sleep 1
          KROKO_TEST_BASE=http://127.0.0.1:4173/ node scripts/kroko-browser-test.mjs
      - name: Upload only game files with verified TLS
        env:
          FTP_HOST: ${{ secrets.SWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.SWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SWEB_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,ftplib,pathlib
          if not all(os.environ.get(k) for k in ['FTP_HOST','FTP_USER','FTP_PASSWORD']):
              raise RuntimeError('Saved hosting credentials are unavailable')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect(os.environ['FTP_HOST'],21)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('/public_html')
          try: ftp.mkd('kroko')
          except ftplib.error_perm as e:
              if not str(e).startswith('550'): raise
          ftp.cwd('kroko')
          source=pathlib.Path('client/studio/public/kroko')
          for name in ['index.html','network.js','rules.js','api.php','cards.php']:
              with (source/name).open('rb') as f: ftp.storbinary('STOR '+name,f)
          ftp.quit()
          print('KROKO_FILES_UPLOADED_TLS_VERIFIED')
          PY
      - name: Verify public HTTPS backend and actual cross-device joining
        run: |
          node --input-type=module <<'JS'
          const hosts=['https://userskins.site/kroko/','https://usersksite.temp.swtest.ru/kroko/'];let verified=0;
          for(const origin of hosts){try{
            const health=await fetch(origin+'api.php?op=health',{signal:AbortSignal.timeout(15000)});const data=await health.json();if(data.version!=='https-v1')throw Error('Wrong API version');
            const token='host-live-'+crypto.randomUUID(),phone='phone-live-'+crypto.randomUUID();
            const headers={'Content-Type':'application/json','X-Player':token};
            const created=await (await fetch(origin+'api.php?op=create',{method:'POST',headers,body:JSON.stringify({cats:['Слова']}),signal:AbortSignal.timeout(15000)})).json();if(!created.code)throw Error('Create failed');
            const result=await (await fetch(origin+'api.php?room='+created.code,{method:'POST',headers:{...headers,'X-Player':phone},body:JSON.stringify({action:'join',team:0,requestId:Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('')}),signal:AbortSignal.timeout(15000)})).json();
            if(result.state?.myTeam!==0)throw Error('Join failed');console.log('PUBLIC_HTTPS_JOIN_OK',origin);verified++;
          }catch(e){console.log('PUBLIC_HTTPS_NOT_READY',origin,e.message)}}
          if(!verified)process.exit(1);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kroko-https-review
          path: kroko-review/
          retention-days: 7
