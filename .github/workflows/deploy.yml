
name: Deploy portfolio to SpaceWeb

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React website
        run: npx vite build

      - name: Test SpaceWeb FTP connection
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SWEB_FTP_HOST }}
          username: ${{ secrets.SWEB_FTP_USER }}
          password: ${{ secrets.SWEB_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/public/
          server-dir: ./
          dry-run: true
