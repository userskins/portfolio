name: Configure free KROKO HTTPS
on:
  push:
    branches: [feature/free-rotate-desk]
    paths: [.github/workflows/kroko-free-https.yml]
permissions:
  contents: read
jobs:
  enable-free-https:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable provider-managed free HTTPS for the existing technical site
        env:
          SWEB_LOGIN: ${{ secrets.SWEB_FTP_USER }}
          SWEB_PASSWORD: ${{ secrets.SWEB_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,sys
          def rpc(url,method,params,token=None):
              headers={'Content-Type':'application/json','Accept':'application/json'}
              if token: headers['Authorization']='Bearer '+token
              request=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','method':method,'params':params}).encode(),headers=headers)
              with urllib.request.urlopen(request,timeout=40) as response: return json.load(response)
          auth=rpc('https://api.sweb.ru/notAuthorized/','getToken',{'login':os.environ['SWEB_LOGIN'],'password':os.environ['SWEB_PASSWORD']})
          token=auth.get('result')
          if not isinstance(token,str):
              print('HOSTING_API_AUTH_ERROR',auth.get('error',{}).get('code'),auth.get('error',{}).get('message'))
              sys.exit(1)
          print('HOSTING_API_AUTH_OK')
          sites=rpc('https://api.sweb.ru/sites','index',{},token)
          def public_hosts(value):
              if isinstance(value,dict):
                  for k,v in value.items():
                      if k.lower() in ['alias','domain','fqdn','hostname','name'] and isinstance(v,str) and '.' in v and '/' not in v: print('HOSTING_SITE_NAME',v)
                      elif isinstance(v,(dict,list)): public_hosts(v)
              elif isinstance(value,list):
                  for item in value: public_hosts(item)
          public_hosts(sites.get('result',{}))
          certs=rpc('https://api.sweb.ru/vh/ssl','index',{},token)
          public_hosts(certs.get('result',{}))
          result=rpc('https://api.sweb.ru/vh/ssl','installLetsEncrypt',{'domain':'usersksite.temp.swtest.ru','ip':'sni','wildcard':0,'challenge':'acme'},token)
          if 'error' in result:
              print('FREE_HTTPS_ERROR',result['error'].get('code'),result['error'].get('message'))
              sys.exit(1)
          print('FREE_HTTPS_REQUEST_ACCEPTED',result.get('result'))
          PY
