
name: Deploy portfolio to SpaceWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React website
        run: npx vite build

        
      - name: Diagnose SpaceWeb connection
        shell: bash
        run: |
          echo "GitHub Runner public IPv4:"
          curl -4fsS --max-time 10 https://api.ipify.org || true
          echo ""
          echo "Testing SpaceWeb FTP port:"
          if nc -4 -z -w 10 vh403.sweb.ru 21; then
            echo "TCP_21_OPEN"
          else
            echo "TCP_21_UNREACHABLE"
          fi

      
      - name: Deploy website to SpaceWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
        with:
          server: ${{ secrets.SWEB_FTP_HOST }}
          username: ${{ secrets.SWEB_FTP_USER }}
          password: ${{ secrets.SWEB_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/public/
          server-dir: ./public_html/
          dry-run: false
