name: Studio preview
on:
  push:
    branches: [feature/studio-scene]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package development source
        run: |
          mkdir -p /tmp/studio-prep
          tar --exclude=.git -czf /tmp/studio-prep/portfolio-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: studio-development-source
          path: /tmp/studio-prep/portfolio-source.tgz
          retention-days: 1
