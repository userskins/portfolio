name: Publish Creative Chaos HTTPS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-creative-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-creative-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Creative Chaos source without changing main website
        uses: actions/checkout@v4
        with:
          ref: design/creative-chaos-site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install packages
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Build for GitHub Pages path
        run: npx vite build --base=/portfolio/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish HTTPS portfolio preview
        id: deployment
        uses: actions/deploy-pages@v4
