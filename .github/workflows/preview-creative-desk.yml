name: Preview Creative Chaos portfolio

on:
  push:
    branches:
      - design/creative-chaos-site
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-chaos-studio-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Build isolated preview for /creative-chaos/
        run: npx vite build --base=/creative-chaos/

      - name: Deploy ONLY creative-chaos preview folder on SpaceWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
        with:
          server: ${{ secrets.SWEB_FTP_HOST }}
          username: ${{ secrets.SWEB_FTP_USER }}
          password: ${{ secrets.SWEB_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/public/
          server-dir: ./public_html/creative-chaos/
          dry-run: false

      - name: Verify public preview does not redirect to home
        shell: bash
        run: |
          set -euo pipefail
          url="http://usersksite.temp.swtest.ru/creative-chaos/"
          for attempt in 1 2 3 4 5; do
            if curl -fLsS --max-time 20 "$url" -o /tmp/creative-preview.html; then
              if grep -q "/creative-chaos/assets/" /tmp/creative-preview.html && grep -q "Дмитрий Гусев" /tmp/creative-preview.html; then
                echo "PREVIEW_READY $url"
                exit 0
              fi
            fi
            echo "Preview not ready yet (attempt $attempt)"
            sleep 4
          done
          echo "Preview could not be verified"
          exit 1

