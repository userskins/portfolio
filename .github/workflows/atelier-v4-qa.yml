name: Atelier V4 - ultralight laptop QA

on:
  push:
    branches: [design/atelier-v4-modern-laptop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atelier-v4-review
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Checkout V4 design
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use verified real artwork and website captures
        uses: actions/download-artifact@v4
        with:
          name: atelier-v3-dist
          run-id: 39683776092
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v3-source-art

      - name: Restore real source materials
        shell: bash
        run: |
          set -euo pipefail
          test -d v3-source-art/art
          mkdir -p client/studio/public/art client/studio/public/previews
          cp -a v3-source-art/art/. client/studio/public/art/
          if [ -d v3-source-art/previews ]; then cp -a v3-source-art/previews/. client/studio/public/previews/; fi
          echo "Owned artworks: $(find client/studio/public/art -type f -name '*.webp' | wc -l)"
          echo "Genuine project captures: $(find client/studio/public/previews -type f -name '*.jpg' | wc -l)"

      - name: Install Chromium and image tools
        run: |
          npm install --prefix /tmp/studio-tools --ignore-scripts playwright@1.56.1
          /tmp/studio-tools/node_modules/.bin/playwright install --with-deps chromium
          python3 -m venv /tmp/studio-py
          /tmp/studio-py/bin/pip install pillow==11.3.0

      - name: Check React types
        run: npx tsc -p tsconfig.studio.json --noEmit

      - name: Build optimized studio
        run: |
          npx vite build --config vite.studio.config.ts
          /tmp/studio-py/bin/python scripts/studio-optimize.py

      - name: Browser test the full desk and new laptop
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/v4-http.log 2>&1 &
          sleep 2
          node scripts/studio-test.mjs
          node scripts/atelier-test.mjs
          node scripts/modern-laptop-test.mjs

      - name: Visual screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-v4-review
          path: |
            ultralight-review/
            atelier-review/
            studio-review/
          retention-days: 7

      - name: Verified static website
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-v4-dist
          path: dist/studio/
          include-hidden-files: true
          retention-days: 7
